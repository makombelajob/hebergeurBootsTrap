services:
    apache:
        image: php:8.5-apache
        container_name: apache_host
        build:
            context: ./php
        ports:
            -   "8080:80"
        volumes:
            -   ./app:/var/www/html/
        depends_on:
            -   mysql

    mysql:
        image: mysql:8.0
        container_name: mysql_host
        environment:
            MYSQL_ROOT_PASSWORD: host7791
            MYSQL_DATABASE: host_web
            MYSQL_USER: johnny
            MYSQL_PASSWORD: johnny7791
        ports:
            -   "3306:3306"
        volumes:
            -   ./mysql:/var/lib/mysql

    phpmyadmin:
        image: phpmyadmin
        container_name: phpmyadmin_host
        ports:
            -   "8081:80"
        environment:
            PMA_HOST: mysql
            PMA_PASSWORD: host7791
        depends_on:
            -   mysql

    postgresql:
        image: bitnami/postgresql
        container_name: postgresql_host
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: sondageRdc
        ports:
            - "5432:5432"
        volumes:
            - ./postgres:/bitnami/postgresql

    pgadmin:
        image: dpage/pgadmin4
        container_name: pgadmin_host
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@hostjob.cd
            PGADMIN_DEFAULT_PASSWORD: admin
        ports:
            -   "8082:80"
        depends_on:
            -   postgresql

    mail_hog:
        image: mailhog/mailhog
        container_name: mailhog_host
        logging:
            driver: 'none'
        ports:
            -   "1025:1025"
            -   "8025:8025"
        

    